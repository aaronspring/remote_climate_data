---
plugins:
  source:
    - module: intake_xarray
sources:
  NOAA_correlation:
    description: climate indices from psl.noaa.gov/data/correlation
    metadata:
      url: https://www.psl.noaa.gov/data/correlation/
    driver: csv
    parameters:
      index:
        description: name of the index
        default: nina34
        type: str
        allowed:
          - pna
          - wp
          - ea
          - nao
          - jonesnao
          - soi
          - nina3
          - censo
          - oni
          - nina1
          - nina4
          - nina34
          - np
          - hurr
          - pacwarm
          - swmonsoon
    args:
      urlpath: simplecache::https://psl.noaa.gov/data/correlation/{{index}}.data
      sep: '  '
      skiprows: 3
      skipfooter: 4
      dtype:
        year: object
      names:
        - year
        - Jan
        - Feb
        - Mar
        - Apr
        - May
        - Jun
        - Jul
        - Aug
        - Sep
        - Oct
        - Nov
        - Dec
      na_values:
        - -999.90
        - '-999.90'
        - '-99.90'
        - -99.90
        - -99.0
        - '-99.0'
      engine: python

  NOAA_correlation_xr:
    description: NOAA_correlation as xr.DataArray
    driver: intake.source.derived.GenericTransform
    args:
      targets:
        - NOAA_correlation
      transform: "remote_climate_data.utils.convert.monthly_csv_to_DataArray"
      transform_kwargs: {}
