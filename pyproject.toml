[build-system]
requires = ["setuptools>=64", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "remote_climate_data"
description = "intake catalogs for climate data sources on the internet for python"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11,<3.14"
maintainers = [
    {name = "Aaron Spring", email = "aaron.spring@posteo.de"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Natural Language :: English",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dynamic = ["version"]
dependencies = [
    "aiohttp>=3.13.3",
    "bokeh",
    "geopandas",
    "hvplot",
    "intake<2",
    "intake-thredds==2024.3.1",
    "intake-geopandas>=0.4.0",
    "intake-xarray>=0.7.0",
    "jupyter-bokeh>=4.0.5",
    "jupyterlab>=4.5.4",
    "matplotlib>=3.10.8",
    "panel",
    "pyarrow",
    "regionmask",
    "requests>=2.32.5",
]

[project.urls]
Homepage = "https://github.com/aaronspring/remote_climate_data/"

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-sugar",
    "pytest-xdist",
    "prek",
]
viz = [
    "hvplot",
    "cartopy",
    "geoviews",
    "matplotlib",
]
io = [
    "netcdf4",
    "h5netcdf",
    "pydap",
]
regionmask = ["regionmask", "intake_geopandas"]
geopandas = ["geopandas", "intake_geopandas"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["remote_climate_data*"]

[tool.setuptools_scm]
version_scheme = "post-release"
local_scheme = "dirty-tag"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["remote_climate_data"]

[tool.ty]
