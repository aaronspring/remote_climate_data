name: Build and Push Binder Image

on:
  push:
    branches:
      - master
      - main
      - upgrade_2026
    paths:
      - 'binder/**'
      - 'pyproject.toml'
      - 'environment.yml'
      - 'requirements.txt'
  pull_request:
    paths:
      - 'binder/**'
      - 'pyproject.toml'
      - 'environment.yml'
      - 'requirements.txt'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and trigger binder cache
        uses: jupyterhub/repo2docker-action@master
        with:
          NO_PUSH: "true"
          MYBINDERORG_TAG: ${{ github.ref_name }}
